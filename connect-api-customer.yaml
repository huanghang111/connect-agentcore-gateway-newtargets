      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HotelApi}/*/*'

  FaqSimplePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FaqSimpleFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HotelApi}/*/*'

  # ========================================
  # API GATEWAY
  # ========================================

  HotelApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: Repair Service API
      Description: Midea Repair Service API
      Body:
        openapi: '3.0.1'
        info:
          title: 'Repair Service API'
          description: 'Midea Repair Service API'
          version: '1.0.0'
        paths:
          /repair/request:
            post:
              operationId: 'requestRepair'
              security:
                - api_key: []
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/RepairRequest'
              responses:
                '401':
                  description: 'Unauthorized - API key required'
                '400':
                  description: '400 response'
                '201':
                  description: '201 response'
              x-amazon-apigateway-integration:
                type: 'aws_proxy'
                httpMethod: 'POST'
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RequestRepairFunction.Arn}/invocations'
          /repair/track:
            post:
              operationId: 'trackRepair'
              security:
                - api_key: []
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/TrackRepairRequest'
              responses:
                '401':
                  description: 'Unauthorized - API key required'
                '400':
                  description: '400 response'
                '404':
                  description: '404 response'
                '200':
                  description: '200 response'
              x-amazon-apigateway-integration:
                type: 'aws_proxy'
                httpMethod: 'POST'
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TrackRepairFunction.Arn}/invocations'
          /repair/cancel:
            post:
              operationId: 'cancelRepair'
              security:
                - api_key: []
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/CancelRepairRequest'
              responses:
                '401':
                  description: 'Unauthorized - API key required'
                '400':
                  description: '400 response'
                '404':
                  description: '404 response'
                '409':
                  description: '409 response'
                '200':
                  description: '200 response'
              x-amazon-apigateway-integration:
                type: 'aws_proxy'
                httpMethod: 'POST'
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CancelRepairFunction.Arn}/invocations'
          /repair/update:
            post:
              operationId: 'updateRepair'
              security:
                - api_key: []
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/UpdateRepairRequest'
              responses:
                '401':
                  description: 'Unauthorized - API key required'
                '400':
                  description: '400 response'
                '404':
                  description: '404 response'
                '409':
                  description: '409 response'
                '200':
                  description: '200 response'
              x-amazon-apigateway-integration:
                type: 'aws_proxy'
                httpMethod: 'POST'
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateRepairFunction.Arn}/invocations'
          /repair/list:
            post:
              operationId: 'listRepairs'
              security:
                - api_key: []
              requestBody:
                required: false
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ListRepairsRequest'
              responses:
                '401':
                  description: 'Unauthorized - API key required'
                '200':
                  description: '200 response'
              x-amazon-apigateway-integration:
                type: 'aws_proxy'
                httpMethod: 'POST'
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListRepairsFunction.Arn}/invocations'
          /faq/simple:
            post:
              operationId: 'faqSimple'
              security:
                - api_key: []
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: 'object'
                      required:
                        - query
                      properties:
                        query:
                          type: 'string'
              responses:
                '401':
                  description: 'Unauthorized - API key required'
                '400':
                  description: '400 response'
                '200':
                  description: '200 response'
              x-amazon-apigateway-integration:
                type: 'aws_proxy'
                httpMethod: 'POST'
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FaqSimpleFunction.Arn}/invocations'
        components:
          schemas:
            RepairRequest:
              type: 'object'
              required:
                - productCategory
                - productsubCategory
                - description
                - brand
              properties:
                productCategory:
                  type: 'string'
                productsubCategory:
                  type: 'string'
                productModel:
                  type: 'string'
                serialNumber:
                  type: 'string'
                description:
                  type: 'string'
                brand:
                  type: 'string'
                customerId:
                  type: 'string'
            TrackRepairRequest:
              type: 'object'
              required:
                - woNumber
              properties:
                woNumber:
                  type: 'string'
                  pattern: '^WO-\d{4}-\d{4}$'
            CancelRepairRequest:
              type: 'object'
              required:
                - woNumber
              properties:
                woNumber:
                  type: 'string'
                  pattern: '^WO-\d{4}-\d{4}$'
            UpdateRepairRequest:
              type: 'object'
              required:
                - woNumber
              properties:
                woNumber:
                  type: 'string'
                  pattern: '^WO-\d{4}-\d{4}$'
                description:
                  type: 'string'
                priority:
                  type: 'string'
                  enum: ['P0', 'P1', 'P2', 'P3']
                status:
                  type: 'string'
                  enum: ['pending', 'scheduled', 'in_progress', 'completed']
            ListRepairsRequest:
              type: 'object'
              properties:
                customerName:
                  type: 'string'
                openOnly:
                  type: 'boolean'
                status:
                  type: 'string'
                  enum: ['pending', 'scheduled', 'in_progress', 'completed', 'cancelled']
                priority:
                  type: 'string'
                  enum: ['P0', 'P1', 'P2', 'P3']
                productCategory:
                  type: 'string'
          securitySchemes:
            api_key:
              type: 'apiKey'
              name: 'X-API-Key'
              in: 'header'

  # API Key for authentication
  HotelApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub '${AWS::StackName}-api-key'
      Description: API Key for Hotel Reservation and Repair Service API
      Enabled: true
      GenerateDistinctId: true

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: ApiGatewayAccount
    Properties:
      RestApiId: !Ref HotelApi

  ApiStageDev:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref HotelApi
      DeploymentId: !Ref ApiDeployment
      StageName: dev
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt ApiLogGroup.Arn
        Format:
          '$context.requestId $context.requestTime $context.httpMethod
          $context.resourcePath $context.status $context.responseLength'
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true

Outputs:
  ApiUrl:
    Description: URL of the Repair Service API
    Value: !Sub 'https://${HotelApi}.execute-api.${AWS::Region}.amazonaws.com/dev'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'

  ApiKey:
    Description: Value of the API Key
    Value: !GetAtt ApiKeyValueRetrieval.ApiKeyValue
    Export:
      Name: !Sub '${AWS::StackName}-ApiKey'

  RepairTicketsTableName:
    Description: Name of the DynamoDB Repair Tickets table
