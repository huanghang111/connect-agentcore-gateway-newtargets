    Value: !Sub |
      Request Repair: https://${HotelApi}.execute-api.${AWS::Region}.amazonaws.com/dev/repair/request
      Track Repair:   https://${HotelApi}.execute-api.${AWS::Region}.amazonaws.com/dev/repair/track
      Cancel Repair:  https://${HotelApi}.execute-api.${AWS::Region}.amazonaws.com/dev/repair/cancel
      Update Repair:  https://${HotelApi}.execute-api.${AWS::Region}.amazonaws.com/dev/repair/update
      List Repairs:   https://${HotelApi}.execute-api.${AWS::Region}.amazonaws.com/dev/repair/list
      FAQ Simple:     https://${HotelApi}.execute-api.${AWS::Region}.amazonaws.com/dev/faq/simple
