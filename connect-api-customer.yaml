                  'category': '服务机器人',
                  'question': '服务机器人电梯联动失败怎么处理？',
                  'answer': '电梯联动失败排查：1) 确认机器人与电梯物联网关均在线。2) 检查联动协议与楼层映射配置。3) 确认电梯端联动模块供电与通信正常。4) 重新触发一次联动并观察日志。5) 配置正确仍失败，请创建维修工单，联系工程师检查联动模块与网关。',
                  'keywords': ['电梯', '联动', '失败', '网关', '服务机器人', '通信']
              },
              {
                  'id': 'faq-009',
                  'category': '通用',
                  'question': '如何创建一张机器人维修工单？',
                  'answer': '创建维修工单流程：1) 先完成身份核验(提供手机号后4位)。2) 告知机器人品类(仓储/巡检/协作机械臂/服务机器人)与故障部件。3) 描述故障现象，并尽量提供型号(如WR-500 #7)。4) 系统会返回一个 WO-YYYY-NNNN 格式的工单号。5) 工程师将在24-48小时内联系您，可凭工单号查询进度。',
                  'keywords': ['维修', '工单', '创建', '报修', 'service', 'repair']
              },
              {
                  'id': 'faq-010',
                  'category': '通用',
                  'question': '如何查询或取消我的工单？',
                  'answer': '查询/取消工单：1) 完成身份核验后，提供完整工单号(WO-YYYY-NNNN)即可查询状态。2) 仅能查询/取消属于本公司名下的工单。3) 已完成或已取消的工单无法再次取消。4) 状态包含：待处理(pending)、处理中(in_progress)、已完成(completed)、已取消(cancelled)。5) 如需加急，请在工单中备注优先级。',
                  'keywords': ['查询', '取消', '工单', 'track', 'cancel', '状态', '进度']
              }
          ]

          def search_faq(query):
              """Simple keyword-based FAQ search"""
              query_lower = query.lower()
              results = []
              
              for faq in FAQ_DATABASE:
                  score = 0
                  
                  # Check if query matches question
                  if query_lower in faq['question'].lower():
                      score += 10
                  
                  # Check if query matches answer
                  if query_lower in faq['answer'].lower():
                      score += 5
                  
                  # Check if query matches keywords
                  for keyword in faq['keywords']:
                      if keyword in query_lower or query_lower in keyword:
                          score += 3
                  
                  # Check for word matches
                  query_words = query_lower.split()
                  for word in query_words:
                      if len(word) > 3:  # Only check words longer than 3 characters
                          if word in faq['question'].lower():
                              score += 2
                          if word in faq['answer'].lower():
                              score += 1
                          for keyword in faq['keywords']:
                              if word in keyword:
                                  score += 2
                  
                  if score > 0:
                      results.append({
                          'id': faq['id'],
                          'category': faq['category'],
                          'question': faq['question'],
                          'answer': faq['answer'],
                          'score': score
                      })
              
              # Sort by score (highest first) and return top 5
              results.sort(key=lambda x: x['score'], reverse=True)
              return results[:5]

          def handler(event, context):
              request_id = event.get('requestContext', {}).get('requestId', 'unknown')
              print(json.dumps({
                  'level': 'INFO',
                  'message': 'FAQ simple search request received',
                  'requestId': request_id,
                  'event': event
              }))

              try:
                  # Handle both API Gateway and direct invocation
                  if 'body' in event and event['body']:
                      body = json.loads(event['body'])
                  else:
                      body = event

                  query = body.get('query')

                  if not query:
                      print(json.dumps({
                          'level': 'WARN',
                          'message': 'Missing query parameter',
                          'requestId': request_id
                      }))
                      return {
                          'statusCode': 400,
                          'headers': {
                              'Content-Type': 'application/json',
                              'Access-Control-Allow-Origin': '*',
                          },
                          'body': json.dumps({'error': 'query parameter is required'})
                      }

                  print(json.dumps({
                      'level': 'INFO',
                      'message': 'Searching FAQ database',
                      'requestId': request_id,
                      'query': query
                  }))

                  # Search FAQ database
                  results = search_faq(query)

                  result = {
                      'statusCode': 200,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*',
                      },
                      'body': json.dumps({
                          'query': query,
                          'results': results,
                          'count': len(results),
                          'source': 'simple_faq_database'
                      })
                  }

                  print(json.dumps({
                      'level': 'INFO',
                      'message': 'FAQ search completed successfully',
                      'requestId': request_id,
                      'resultCount': len(results),
                      'response': result
                  }))

                  return result

              except Exception as e:
                  print(json.dumps({
                      'level': 'ERROR',
                      'message': 'Error searching FAQ',
                      'requestId': request_id,
                      'error': str(e),
                      'stack': traceback.format_exc()
                  }))
                  return {
                      'statusCode': 500,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*',
                      },
                      'body': json.dumps({
                          'error': 'Internal server error',
                          'message': str(e)
                      })
                  }

  # ========================================
  # LAMBDA PERMISSIONS
  # ========================================

  # Hotel API Permissions
  RequestRepairPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RequestRepairFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HotelApi}/*/*'

  TrackRepairPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TrackRepairFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HotelApi}/*/*'

  CancelRepairPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CancelRepairFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HotelApi}/*/*'

  UpdateRepairPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdateRepairFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HotelApi}/*/*'

  ListRepairsPermission:
