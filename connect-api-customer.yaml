    Properties:
      Name: !Sub '${AWS::StackName}-api-key'
      Description: API Key for Hotel Reservation and Repair Service API
      Enabled: true
      GenerateDistinctId: true

  # IMPORTANT — AWS::ApiGateway::Deployment has a fixed logical ID, so CloudFormation
  # creates it ONCE and does NOT re-deploy when the RestApi Body changes (e.g. adding
  # a route). A stack UPDATE that adds an endpoint will leave the new route returning
  # "Missing Authentication Token" on the stage until a fresh deployment is made.
  # The canonical fix is to BUMP THE LOGICAL ID SUFFIX (ApiDeploymentV2 -> V3 -> ...)
  # whenever you change any path/method in the Body below. That forces CloudFormation
  # to create a new Deployment capturing the current API surface. (Fresh create-stack
  # is unaffected — it always captures the full Body.)
  ApiDeploymentV2:
    Type: AWS::ApiGateway::Deployment
    DependsOn: ApiGatewayAccount
    Properties:
      RestApiId: !Ref HotelApi

  ApiStageDev:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref HotelApi
      DeploymentId: !Ref ApiDeploymentV2
      StageName: dev
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt ApiLogGroup.Arn
        Format:
          '$context.requestId $context.requestTime $context.httpMethod
          $context.resourcePath $context.status $context.responseLength'
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true

Outputs:
  ApiUrl:
    Description: URL of the Repair Service API
    Value: !Sub 'https://${HotelApi}.execute-api.${AWS::Region}.amazonaws.com/dev'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'

  ApiKey:
    Description: Value of the API Key
    Value: !GetAtt ApiKeyValueRetrieval.ApiKeyValue
    Export:
      Name: !Sub '${AWS::StackName}-ApiKey'

  RepairTicketsTableName:
    Description: Name of the DynamoDB Repair Tickets table
    Value: !Ref RepairTicketsTable
    Export:
      Name: !Sub '${AWS::StackName}-RepairTicketsTable'

  OpenApiSpecS3Location:
    Description: S3 location of the uploaded OpenAPI specification
    Value: !GetAtt OpenApiUpload.S3Location
    Export:
      Name: !Sub '${AWS::StackName}-OpenApiSpec'

  ApiEndpoints:
    Description: Available API endpoints
    Value: !Sub |
      Request Repair: https://${HotelApi}.execute-api.${AWS::Region}.amazonaws.com/dev/repair/request
      Track Repair:   https://${HotelApi}.execute-api.${AWS::Region}.amazonaws.com/dev/repair/track
      Cancel Repair:  https://${HotelApi}.execute-api.${AWS::Region}.amazonaws.com/dev/repair/cancel
      List Repairs:   https://${HotelApi}.execute-api.${AWS::Region}.amazonaws.com/dev/repair/list
      FAQ Simple:     https://${HotelApi}.execute-api.${AWS::Region}.amazonaws.com/dev/faq/simple
