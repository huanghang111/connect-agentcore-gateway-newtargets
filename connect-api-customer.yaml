  ListRepairsFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt RepairLambdaExecutionRole.Arn
      TracingConfig:
        Mode: Active
      LoggingConfig:
        LogGroup: !Ref RepairLambdaLogGroup
        LogFormat: JSON
      Environment:
        Variables:
          REPAIR_TICKETS_TABLE_NAME: !Ref RepairTicketsTable
      Code:
        ZipFile: |
          const { DynamoDBClient } = require('@aws-sdk/client-dynamodb');
          const { DynamoDBDocumentClient, ScanCommand } = require('@aws-sdk/lib-dynamodb');

          const client = new DynamoDBClient({});
          const docClient = DynamoDBDocumentClient.from(client);

          const OPEN_STATUSES = ['pending', 'scheduled', 'in_progress'];

          const resp = (statusCode, obj) => ({
              statusCode,
              headers: {
                  'Content-Type': 'application/json',
                  'Access-Control-Allow-Origin': '*',
              },
              body: JSON.stringify(obj),
          });

          // Scan the whole (small) table, paginating defensively.
          async function scanAll() {
              const items = [];
              let ExclusiveStartKey;
              do {
                  const out = await docClient.send(new ScanCommand({
                      TableName: process.env.REPAIR_TICKETS_TABLE_NAME,
                      ExclusiveStartKey,
                  }));
                  (out.Items || []).forEach((i) => items.push(i));
                  ExclusiveStartKey = out.LastEvaluatedKey;
              } while (ExclusiveStartKey);
              return items;
          }

          exports.handler = async (event) => {
              const requestId = event.requestContext?.requestId || 'unknown';
              console.log(JSON.stringify({
                  level: 'INFO',
                  message: 'List repairs request received',
                  requestId,
                  event: event
              }));

              try {
                  const body = JSON.parse(event.body || '{}');
                  const { customerName, status, priority, productCategory, openOnly } = body;

                  // Normalize filters (all optional). String match is
                  // case-insensitive substring for customerName, exact for the
                  // enum-like fields.
                  const cn = (customerName || '').trim().toLowerCase();
                  const st = (status || '').trim();
                  const pr = (priority || '').trim();
                  const pc = (productCategory || '').trim();
                  const openFlag = openOnly === true || openOnly === 'true';

                  let items = await scanAll();

                  items = items.filter((t) => {
                      if (cn && !String(t.customerName || '').toLowerCase().includes(cn)) return false;
                      if (st && t.status !== st) return false;
                      if (openFlag && !OPEN_STATUSES.includes(t.status)) return false;
                      if (pr && t.priority !== pr) return false;
                      if (pc && t.productCategory !== pc) return false;
                      return true;
                  });

                  // Sort by priority (P0 first) then work-order number for a
                  // stable, sensible order.
                  items.sort((a, b) => {
                      const pa = String(a.priority || 'P9');
                      const pb = String(b.priority || 'P9');
                      if (pa !== pb) return pa < pb ? -1 : 1;
                      return String(a.ticketNumber).localeCompare(String(b.ticketNumber));
                  });

                  const tickets = items.map((t) => ({
                      ticketNumber: t.ticketNumber,
                      status: t.status ?? null,
                      priority: t.priority ?? null,
                      productCategory: t.productCategory ?? null,
                      productsubCategory: t.productsubCategory ?? null,
                      productModel: t.productModel ?? null,
                      customerName: t.customerName ?? null,
                      description: t.description ?? null,
                      updatedAt: t.updatedAt ?? null,
                  }));

                  // Aggregates so the caller can answer "how many / any urgent".
                  const byPriority = {};
                  const byStatus = {};
                  tickets.forEach((t) => {
                      if (t.priority) byPriority[t.priority] = (byPriority[t.priority] || 0) + 1;
                      if (t.status) byStatus[t.status] = (byStatus[t.status] || 0) + 1;
                  });

                  console.log(JSON.stringify({
                      level: 'INFO',
                      message: 'List repairs completed',
                      requestId,
                      count: tickets.length,
                  }));

                  return resp(200, {
                      message: 'Repair tickets listed',
                      count: tickets.length,
                      urgentCount: byPriority['P0'] || 0,
                      byPriority,
                      byStatus,
                      tickets,
                  });
              } catch (error) {
                  console.log(JSON.stringify({
                      level: 'ERROR',
                      message: 'Error listing repair tickets',
                      requestId,
                      error: error.message,
                      stack: error.stack
                  }));
                  return resp(500, { error: 'Internal server error', message: error.message });
              }
          };

  CancelRepairFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt RepairLambdaExecutionRole.Arn
      TracingConfig:
        Mode: Active
      LoggingConfig:
        LogGroup: !Ref RepairLambdaLogGroup
        LogFormat: JSON
      Environment:
        Variables:
          REPAIR_TICKETS_TABLE_NAME: !Ref RepairTicketsTable
      Code:
        ZipFile: |
          const { DynamoDBClient } = require('@aws-sdk/client-dynamodb');
          const { DynamoDBDocumentClient, GetCommand, UpdateCommand } = require('@aws-sdk/lib-dynamodb');

          const client = new DynamoDBClient({});
          const docClient = DynamoDBDocumentClient.from(client);

          exports.handler = async (event) => {
              const requestId = event.requestContext?.requestId || 'unknown';
              console.log(JSON.stringify({
                  level: 'INFO',
                  message: 'Cancel repair request received',
                  requestId,
                  event: event
              }));

              try {
                  const body = JSON.parse(event.body || '{}');
                  const { woNumber } = body;

                  if (!woNumber || !/^WO-\d{4}-\d{4}$/.test(woNumber)) {
                      console.log(JSON.stringify({
                          level: 'WARN',
                          message: 'Invalid woNumber',
                          requestId,
                          woNumber
                      }));
                      return {
                          statusCode: 400,
                          headers: {
                              'Content-Type': 'application/json',
                              'Access-Control-Allow-Origin': '*',
                          },
                          body: JSON.stringify({
                              error: 'woNumber is required and must look like WO-YYYY-NNNN',
                          }),
                      };
                  }

                  // Look up the ticket first so we can return precise 404/409.
                  const getResult = await docClient.send(new GetCommand({
                      TableName: process.env.REPAIR_TICKETS_TABLE_NAME,
                      Key: { ticketNumber: woNumber },
                  }));

                  // Identity/ownership checks are DISABLED — any caller may cancel
                  // any work order. 404 only when the work order does not exist.
                  if (!getResult.Item) {
                      return {
                          statusCode: 404,
                          headers: {
                              'Content-Type': 'application/json',
                              'Access-Control-Allow-Origin': '*',
                          },
                          body: JSON.stringify({ error: 'Repair ticket not found' }),
                      };
                  }

                  const currentStatus = getResult.Item.status;
                  if (currentStatus === 'cancelled' || currentStatus === 'completed') {
                      return {
                          statusCode: 409,
                          headers: {
                              'Content-Type': 'application/json',
                              'Access-Control-Allow-Origin': '*',
                          },
                          body: JSON.stringify({
                              error: `Work order is already ${currentStatus}`,
                              status: currentStatus,
                          }),
                      };
                  }

                  await docClient.send(new UpdateCommand({
                      TableName: process.env.REPAIR_TICKETS_TABLE_NAME,
                      Key: { ticketNumber: woNumber },
                      UpdateExpression: 'SET #s = :s, updatedAt = :u',
                      ExpressionAttributeNames: { '#s': 'status' },
                      ExpressionAttributeValues: {
                          ':s': 'cancelled',
                          ':u': new Date().toISOString(),
                      },
                  }));

                  console.log(JSON.stringify({
                      level: 'INFO',
                      message: 'Repair ticket cancelled',
                      requestId,
                      ticketNumber: woNumber
                  }));

                  return {
                      statusCode: 200,
                      headers: {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*',
                      },
                      body: JSON.stringify({
                          message: 'Repair ticket cancelled',
                          ticketNumber: woNumber,
                          status: 'cancelled',
                      }),
                  };
              } catch (error) {
                  console.log(JSON.stringify({
                      level: 'ERROR',
                      message: 'Error cancelling repair ticket',
                      requestId,
                      error: error.message,
                      stack: error.stack
                  }));
                  return {
                      statusCode: 500,
                      headers: {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*',
                      },
                      body: JSON.stringify({
                          error: 'Internal server error',
                          message: error.message,
                      }),
                  };
              }
          };

  UpdateRepairFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt RepairLambdaExecutionRole.Arn
      TracingConfig:
        Mode: Active
      LoggingConfig:
        LogGroup: !Ref RepairLambdaLogGroup
        LogFormat: JSON
      Environment:
        Variables:
          REPAIR_TICKETS_TABLE_NAME: !Ref RepairTicketsTable
      Code:
        ZipFile: |
          const { DynamoDBClient } = require('@aws-sdk/client-dynamodb');
          const { DynamoDBDocumentClient, GetCommand, UpdateCommand } = require('@aws-sdk/lib-dynamodb');

          const client = new DynamoDBClient({});
          const docClient = DynamoDBDocumentClient.from(client);

          // status here intentionally EXCLUDES 'cancelled' — cancelling a work
          // order is done via /repair/cancel, not this update endpoint.
          const ALLOWED_STATUS = ['pending', 'scheduled', 'in_progress', 'completed'];
          const ALLOWED_PRIORITY = ['P0', 'P1', 'P2', 'P3'];

          const resp = (statusCode, obj) => ({
              statusCode,
              headers: {
                  'Content-Type': 'application/json',
                  'Access-Control-Allow-Origin': '*',
              },
              body: JSON.stringify(obj),
          });

          exports.handler = async (event) => {
              const requestId = event.requestContext?.requestId || 'unknown';
              console.log(JSON.stringify({
                  level: 'INFO',
                  message: 'Update repair request received',
                  requestId,
                  event: event
              }));

              try {
                  const body = JSON.parse(event.body || '{}');
                  const { woNumber, description, priority, status } = body;

                  if (!woNumber || !/^WO-\d{4}-\d{4}$/.test(woNumber)) {
                      return resp(400, { error: 'woNumber is required and must look like WO-YYYY-NNNN' });
                  }

                  // At least one mutable field must be provided.
                  const hasDescription = description !== undefined && description !== null && description !== '';
                  const hasPriority = priority !== undefined && priority !== null && priority !== '';
                  const hasStatus = status !== undefined && status !== null && status !== '';
                  if (!hasDescription && !hasPriority && !hasStatus) {
                      return resp(400, { error: 'Provide at least one of: description, priority, status' });
                  }
                  if (hasPriority && !ALLOWED_PRIORITY.includes(priority)) {
                      return resp(400, { error: `priority must be one of: ${ALLOWED_PRIORITY.join(', ')}` });
                  }
                  if (hasStatus && !ALLOWED_STATUS.includes(status)) {
                      return resp(400, { error: `status must be one of: ${ALLOWED_STATUS.join(', ')}` });
                  }

                  // Look up the ticket first so we can return precise 404/409.
                  const getResult = await docClient.send(new GetCommand({
                      TableName: process.env.REPAIR_TICKETS_TABLE_NAME,
                      Key: { ticketNumber: woNumber },
                  }));

                  // Identity/ownership checks are DISABLED — any caller may update
                  // any work order. 404 only when the work order does not exist.
                  if (!getResult.Item) {
                      return resp(404, { error: 'Repair ticket not found' });
                  }

                  const currentStatus = getResult.Item.status;
                  if (currentStatus === 'cancelled' || currentStatus === 'completed') {
                      return resp(409, {
                          error: `Work order is already ${currentStatus} and cannot be modified`,
                          status: currentStatus,
                      });
                  }

                  // Build a dynamic SET expression from only the provided fields.
                  const sets = ['updatedAt = :u'];
                  const names = {};
                  const values = { ':u': new Date().toISOString() };
                  if (hasDescription) { sets.push('description = :d'); values[':d'] = description; }
                  if (hasPriority) { sets.push('priority = :p'); values[':p'] = priority; }
                  if (hasStatus) { sets.push('#s = :s'); names['#s'] = 'status'; values[':s'] = status; }

                  const updateParams = {
                      TableName: process.env.REPAIR_TICKETS_TABLE_NAME,
                      Key: { ticketNumber: woNumber },
                      UpdateExpression: 'SET ' + sets.join(', '),
                      ExpressionAttributeValues: values,
                      ReturnValues: 'ALL_NEW',
                  };
                  if (Object.keys(names).length > 0) {
                      updateParams.ExpressionAttributeNames = names;
                  }

                  const updated = await docClient.send(new UpdateCommand(updateParams));
                  const item = updated.Attributes || {};

                  console.log(JSON.stringify({
                      level: 'INFO',
                      message: 'Repair ticket updated',
                      requestId,
                      ticketNumber: woNumber,
                      updatedFields: sets.filter(s => s !== 'updatedAt = :u'),
                  }));

                  return resp(200, {
                      message: 'Repair ticket updated',
                      ticketNumber: woNumber,
                      status: item.status ?? null,
                      priority: item.priority ?? null,
                      description: item.description ?? null,
                      updatedAt: item.updatedAt ?? null,
                  });
              } catch (error) {
                  console.log(JSON.stringify({
                      level: 'ERROR',
                      message: 'Error updating repair ticket',
                      requestId,
                      error: error.message,
                      stack: error.stack
                  }));
                  return resp(500, { error: 'Internal server error', message: error.message });
              }
          };

