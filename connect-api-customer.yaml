              },
              {
                  'id': 'faq-014',
                  'category': 'Air Conditioner',
                  'question': '空调不制冷是什么原因？',
                  'answer': '空调不制冷常见原因：1）滤网太脏，清洗或更换滤网；2）出风口被遮挡，保持气流畅通；3）温度设置过高，调低设定温度；4）制冷剂不足，需联系维修加注；5）室外机故障，检查室外机是否运转。',
                  'keywords': ['空调', '不制冷', '不凉', '不冷', '制冷', '温度', '冷气']
              },
              {
                  'id': 'faq-015',
                  'category': 'Refrigerator',
                  'question': '冰箱噪音大/有异响怎么办？',
                  'answer': '冰箱噪音常见原因：1）压缩机运转的嗡嗡声属正常；2）制冰/进水时的咕噜声属正常；3）风扇被冰块或杂物碰到，检查是否结冰或有松动物品；4）地面不平，调平冰箱脚；5）背板或螺丝松动，紧固即可。若噪音异常持续，请预约维修。',
                  'keywords': ['冰箱', '噪音', '响声', '异响', '声音', '嗡嗡', '吵']
              },
              {
                  'id': 'faq-016',
                  'category': 'General',
                  'question': '如何预约维修服务？',
                  'answer': '预约维修：1）提供产品类别、品牌、所在省市区和故障描述；2）系统会生成一个10位工单号；3）维修工程师会在24-48小时内与您联系；4）可随时凭工单号查询维修进度。',
                  'keywords': ['预约', '维修', '报修', '上门', '工程师', '服务', '保修']
              }
          ]

          def search_faq(query):
              """Simple keyword-based FAQ search"""
              query_lower = query.lower()
              results = []
              
              for faq in FAQ_DATABASE:
                  score = 0
                  
                  # Check if query matches question
                  if query_lower in faq['question'].lower():
                      score += 10
                  
                  # Check if query matches answer
                  if query_lower in faq['answer'].lower():
                      score += 5
                  
                  # Check if query matches keywords
                  for keyword in faq['keywords']:
                      if keyword in query_lower or query_lower in keyword:
                          score += 3
                  
                  # Check for word matches
                  query_words = query_lower.split()
                  for word in query_words:
                      if len(word) > 3:  # Only check words longer than 3 characters
                          if word in faq['question'].lower():
                              score += 2
                          if word in faq['answer'].lower():
                              score += 1
                          for keyword in faq['keywords']:
                              if word in keyword:
                                  score += 2
                  
                  if score > 0:
                      results.append({
                          'id': faq['id'],
                          'category': faq['category'],
                          'question': faq['question'],
                          'answer': faq['answer'],
                          'score': score
                      })
              
              # Sort by score (highest first) and return top 5
              results.sort(key=lambda x: x['score'], reverse=True)
              return results[:5]

          def handler(event, context):
              request_id = event.get('requestContext', {}).get('requestId', 'unknown')
              print(json.dumps({
                  'level': 'INFO',
                  'message': 'FAQ simple search request received',
                  'requestId': request_id,
                  'event': event
              }))

              try:
                  # Handle both API Gateway and direct invocation
                  if 'body' in event and event['body']:
                      body = json.loads(event['body'])
                  else:
                      body = event

                  query = body.get('query')

                  if not query:
                      print(json.dumps({
                          'level': 'WARN',
                          'message': 'Missing query parameter',
                          'requestId': request_id
                      }))
                      return {
                          'statusCode': 400,
                          'headers': {
                              'Content-Type': 'application/json',
                              'Access-Control-Allow-Origin': '*',
                          },
                          'body': json.dumps({'error': 'query parameter is required'})
                      }

                  print(json.dumps({
                      'level': 'INFO',
                      'message': 'Searching FAQ database',
                      'requestId': request_id,
                      'query': query
                  }))

                  # Search FAQ database
                  results = search_faq(query)

                  result = {
                      'statusCode': 200,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*',
                      },
                      'body': json.dumps({
                          'query': query,
                          'results': results,
                          'count': len(results),
                          'source': 'simple_faq_database'
                      })
                  }

                  print(json.dumps({
                      'level': 'INFO',
                      'message': 'FAQ search completed successfully',
                      'requestId': request_id,
                      'resultCount': len(results),
                      'response': result
                  }))

                  return result

              except Exception as e:
                  print(json.dumps({
                      'level': 'ERROR',
                      'message': 'Error searching FAQ',
                      'requestId': request_id,
                      'error': str(e),
                      'stack': traceback.format_exc()
                  }))
                  return {
                      'statusCode': 500,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*',
                      },
                      'body': json.dumps({
                          'error': 'Internal server error',
                          'message': str(e)
                      })
                  }

  ListRepairsFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt RepairLambdaExecutionRole.Arn
      TracingConfig:
        Mode: Active
      LoggingConfig:
        LogGroup: !Ref RepairLambdaLogGroup
        LogFormat: JSON
      Environment:
        Variables:
          REPAIR_TICKETS_TABLE_NAME: !Ref RepairTicketsTable
      Code:
        ZipFile: |
          const { DynamoDBClient } = require('@aws-sdk/client-dynamodb');
          const { DynamoDBDocumentClient, QueryCommand } = require('@aws-sdk/lib-dynamodb');

          const client = new DynamoDBClient({});
          const docClient = DynamoDBDocumentClient.from(client);

          const MAX_ORDERS = 5;

          const resp = (statusCode, obj) => ({
              statusCode,
              headers: {
                  'Content-Type': 'application/json',
                  'Access-Control-Allow-Origin': '*',
              },
              body: JSON.stringify(obj),
          });

          exports.handler = async (event) => {
              const requestId = event.requestContext?.requestId || 'unknown';
              console.log(JSON.stringify({
                  level: 'INFO',
                  message: 'List repairs request received',
                  requestId,
                  event: event
              }));

              try {
                  const body = JSON.parse(event.body || '{}');
                  // The MCP server forwards the resolved customerId as `phone`.
                  const phone = (body.phone || body.customerId || '').trim();

                  if (!phone) {
                      return resp(400, {
                          error: 'phone is required to list a customer\'s work orders',
                      });
                  }

                  // Query the PhoneIndex GSI for all tickets owned by this phone.
                  const out = await docClient.send(new QueryCommand({
                      TableName: process.env.REPAIR_TICKETS_TABLE_NAME,
                      IndexName: 'PhoneIndex',
                      KeyConditionExpression: '#p = :phone',
                      ExpressionAttributeNames: { '#p': 'phone' },
                      ExpressionAttributeValues: { ':phone': phone },
                  }));

                  let items = out.Items || [];

                  // Newest first by createdAt (ISO 8601 sorts lexicographically).
                  items.sort((a, b) =>
                      String(b.createdAt || '').localeCompare(String(a.createdAt || '')));

                  const orders = items.slice(0, MAX_ORDERS).map((t) => ({
                      woNumber: t.ticketNumber,
                      status: t.status ?? null,
                      productCategory: t.productCategory ?? null,
                      productsubCategory: t.productsubCategory ?? null,
                      brand: t.brand ?? null,
                      description: t.description ?? null,
                      createdAt: t.createdAt ?? null,
                      updatedAt: t.updatedAt ?? null,
                  }));

                  console.log(JSON.stringify({
                      level: 'INFO',
                      message: 'List repairs completed',
                      requestId,
                      total: items.length,
                      returned: orders.length
                  }));

                  return resp(200, {
                      orders,
                      count: orders.length,
                      total: items.length,
                  });
              } catch (error) {
                  console.log(JSON.stringify({
                      level: 'ERROR',
                      message: 'Error listing repairs',
                      requestId,
                      error: error.message,
                      stack: error.stack
                  }));
                  return resp(500, {
                      error: 'Internal server error',
                      message: error.message,
                  });
              }
          };

