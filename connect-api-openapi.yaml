openapi: 3.0.1
info:
  title: Repair Service API
  description: Midea Repair Service REST API
  version: 1.0.0
  contact:
    name: AWS Workshop Team
  license:
    name: MIT

servers:
  - url: ${API_GATEWAY_URL}
    description: AWS API Gateway endpoint

paths:
  # ========================================
  # REPAIR SERVICE APIS
  # ========================================

  /repair/request:
    post:
      operationId: requestRepair
      summary: Request a repair service
      description: |
        Create a new repair work order. Records the product, address, and a description
        built from the dialog, and returns a unique 10-digit work-order number.
      tags:
        - Repair Service
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productCategory
                - productsubCategory
                - province
                - city
                - district
                - description
                - brand
              properties:
                productCategory:
                  type: string
                  description: Top-level product category. Must be validated via the product category lookup API.
                  example: 'Refrigerator'
                productsubCategory:
                  type: string
                  description: Product sub-category. Must be validated via the product category lookup API.
                  example: 'French Door'
                productModel:
                  type: string
                  description: Product model. Optional. If provided, must be validated via the product model/SN API.
                  example: 'MF200W90BE'
                serialNumber:
                  type: string
                  description: Product serial number. Optional. If provided, must be validated via the product model/SN API.
                  example: 'SN20231015ABC124'
                province:
                  type: string
                  description: Province / state. Must be validated via the address mapping API.
                  example: 'NY'
                city:
                  type: string
                  description: City. Must be validated via the address mapping API.
                  example: 'New York'
                district:
                  type: string
                  description: District / street. Must be validated via the address mapping API.
                  example: 'Manhattan'
                description:
                  type: string
                  description: Work-order remark — AI summary plus dialog transcript.
                  example: "Refrigerator stopped cooling overnight. Already tried unplugging for 10 minutes."
                brand:
                  type: string
                  description: Product brand. Extracted from the dialog or product library.
                  example: 'AnyCompany'
      responses:
        '201':
          description: Repair ticket created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Repair ticket created successfully'
                  ticketNumber:
                    type: string
                    description: Unique 10-digit repair ticket number
                    example: '1234567890'
                  ticket:
                    $ref: '#/components/schemas/RepairTicket'
        '400':
          description: Bad request - missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /repair/track:
    post:
      operationId: trackRepair
      summary: Track repair work-order status
      description: |
        Look up the status and details of an existing repair work order by its
        work-order number. The caller is expected to validate that woNumber is a
        non-empty 10-digit numeric string before invoking this endpoint.
      tags:
        - Repair Service
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - woNumber
              properties:
                woNumber:
                  type: string
                  description: The work-order number (10-digit numeric string).
                  pattern: '^\d{10}$'
                  example: '1234567890'
      responses:
        '200':
          description: Repair work order found and status returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Repair ticket found'
                  ticket:
                    type: object
                    properties:
                      ticketNumber:
                        type: string
                        example: '1234567890'
                      status:
                        type: string
                        description: Current status of the work order
                        enum: ['pending', 'scheduled', 'in_progress', 'completed', 'cancelled']
                        example: 'pending'
                      productCategory:
                        type: string
                        example: 'Refrigerator'
                      productsubCategory:
                        type: string
                        example: 'French Door'
                      productModel:
                        type: string
                        example: 'MF200W90BE'
                      serialNumber:
                        type: string
                        example: 'SN20231015ABC124'
                      brand:
                        type: string
                        example: 'AnyCompany'
                      province:
                        type: string
                        example: 'NY'
                      city:
                        type: string
                        example: 'New York'
                      district:
                        type: string
                        example: 'Manhattan'
                      description:
                        type: string
                        example: 'Refrigerator stopped cooling overnight'
                      createdAt:
                        type: string
                        format: date-time
                        example: '2024-01-20T10:30:00Z'
                      updatedAt:
                        type: string
                        format: date-time
                        example: '2024-01-20T10:30:00Z'
        '400':
          description: Bad request - missing or malformed woNumber
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Repair work order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /repair/cancel:
    post:
      operationId: cancelRepair
      summary: Cancel a repair work order
      description: |
        Cancel an existing repair work order by its work-order number. The caller
        is expected to validate that woNumber is a non-empty 10-digit numeric
        string and to obtain explicit user confirmation before invoking this
        endpoint, since cancellation is destructive.
      tags:
        - Repair Service
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - woNumber
              properties:
                woNumber:
                  type: string
                  description: The work-order number (10-digit numeric string).
                  pattern: '^\d{10}$'
                  example: '1234567890'
      responses:
        '200':
          description: Work order cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Repair ticket cancelled'
                  ticketNumber:
                    type: string
                    example: '1234567890'
                  status:
                    type: string
                    example: 'cancelled'
        '400':
          description: Bad request - missing or malformed woNumber
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Repair work order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Work order already cancelled or completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /faq/simple:
    post:
      operationId: faqSimple
      summary: Search FAQ simple database
      description: |
        Search through a predefined FAQ database without using external knowledge base.
        This API provides quick answers to common questions using keyword-based matching.
        Does not require Bedrock Knowledge Base.
      tags:
        - FAQ & Knowledge Base
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: Natural language question or search query
                  example: 'How do I reset my air conditioner?'
      responses:
        '200':
          description: Search results from simple FAQ database
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                    description: The original search query
                    example: 'How do I reset my air conditioner?'
                  results:
                    type: array
                    description: List of relevant FAQ entries
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: FAQ entry ID
                          example: 'faq-001'
                        category:
                          type: string
                          description: FAQ category
                          example: 'Air Conditioner'
                        question:
                          type: string
                          description: The FAQ question
                          example: 'How do I reset my air conditioner?'
                        answer:
                          type: string
                          description: The FAQ answer
                          example: 'To reset your air conditioner: 1) Turn off the unit...'
                        score:
                          type: number
                          description: Relevance score (higher is more relevant)
                          example: 15
                  count:
                    type: integer
                    description: Number of results returned
                    example: 3
                  source:
                    type: string
                    description: Source of the results
                    example: 'simple_faq_database'
              example:
                query: 'How do I reset my air conditioner?'
                results:
                  - id: 'faq-001'
                    category: 'Air Conditioner'
                    question: 'How do I reset my air conditioner?'
                    answer: 'To reset your air conditioner: 1) Turn off the unit using the remote or control panel. 2) Unplug the power cord from the outlet. 3) Wait for 3-5 minutes. 4) Plug the power cord back in. 5) Turn on the unit.'
                    score: 15
                count: 1
                source: 'simple_faq_database'
        '400':
          description: Bad request - missing query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication

  schemas:
    RepairTicket:
      type: object
      properties:
        ticketNumber:
          type: string
          description: Unique 10-digit repair ticket number
          example: '1234567890'
        product_model:
          type: string
          description: Product model name or number
          example: 'AC-2000X'
        serial_number:
          type: string
          description: Product serial number
          example: 'SN123456789'
        purchase_date:
          type: string
          format: date
          description: Product purchase date
          example: '2023-06-15'
        issue_description:
          type: string
          description: Description of the issue
          example: 'Air conditioner not cooling properly'
        full_name:
          type: string
          description: Customer name
          example: 'John Smith'
        phone:
          type: string
          description: Customer phone number
          example: '+1-555-123-4567'
        service_address:
          type: string
          description: Service address
          example: '123 Main St, Apt 4B, New York, NY 10001'
        preferred_time:
          type: string
          description: Preferred service time
          example: '2024-02-15 14:00'
        warranty_status:
          type: string
          description: Warranty status
          enum: ['yes', 'no', 'unknown']
          example: 'yes'
        status:
          type: string
          description: Current ticket status
          enum: ['pending', 'scheduled', 'in_progress', 'completed', 'cancelled']
          example: 'pending'
        createdAt:
          type: string
          format: date-time
          description: Ticket creation timestamp
          example: '2024-01-20T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: '2024-01-20T10:30:00Z'

security:
  - ApiKeyAuth: []

tags:
  - name: Hotel Search
    description: Operations for searching and discovering hotels
  - name: Booking Management
    description: Operations for creating, modifying, and cancelling reservations
  - name: Customer Service
    description: Operations for customer service and support
  - name: Repair Service
    description: Operations for requesting and tracking repair services
  - name: FAQ & Knowledge Base
    description: Operations for searching FAQ and knowledge base content
