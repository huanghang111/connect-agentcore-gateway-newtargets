openapi: 3.0.1
info:
  title: Repair Service API
  description: Industrial Robot Repair Service REST API
  version: 1.0.0
  contact:
    name: AWS Workshop Team
  license:
    name: MIT

servers:
  - url: ${API_GATEWAY_URL}
    description: AWS API Gateway endpoint

paths:
  # ========================================
  # REPAIR SERVICE APIS
  # ========================================

  /repair/request:
    post:
      operationId: requestRepair
      summary: Request a repair service
      description: |
        Create a new industrial-robot repair work order. Records the robot product,
        the faulty component, and a description built from the dialog, and returns a
        unique work-order number of the form WO-YYYY-NNNN.
      tags:
        - Repair Service
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productCategory
                - productsubCategory
                - description
                - brand
              properties:
                productCategory:
                  type: string
                  description: 'Top-level robot category. One of: 仓储机器人, 巡检机器人, 协作机械臂, 服务机器人.'
                  example: '仓储机器人'
                productsubCategory:
                  type: string
                  description: Faulty component. Must belong to the chosen productCategory (e.g. 仓储机器人 → 导航传感器/电池/驱动电机/通信模块).
                  example: '导航传感器'
                productModel:
                  type: string
                  description: Robot model. Optional.
                  example: 'WR-500 #7'
                serialNumber:
                  type: string
                  description: Unit serial number. Optional.
                  example: 'SN20231015ABC124'
                description:
                  type: string
                  description: Work-order remark — AI summary plus dialog transcript.
                  example: '导航传感器异常，频繁偏航'
                brand:
                  type: string
                  description: Product brand / manufacturer. Extracted from the dialog.
                  example: '中科机器人'
      responses:
        '201':
          description: Repair ticket created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Repair ticket created successfully'
                  ticketNumber:
                    type: string
                    description: Unique work-order number (WO-YYYY-NNNN)
                    example: 'WO-2026-1234'
                  ticket:
                    $ref: '#/components/schemas/RepairTicket'
        '400':
          description: Bad request - missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /repair/track:
    post:
      operationId: trackRepair
      summary: Track repair work-order status
      description: |
        Look up the status and details of an existing repair work order by its
        work-order number. The caller is expected to validate that woNumber is a
        non-empty WO-YYYY-NNNN string before invoking this endpoint. Identity
        verification is disabled — any caller may look up any work order. 404
        means the work order does not exist.
      tags:
        - Repair Service
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - woNumber
              properties:
                woNumber:
                  type: string
                  description: The work-order number (WO-YYYY-NNNN).
                  pattern: '^WO-\d{4}-\d{4}$'
                  example: 'WO-2026-0001'
      responses:
        '200':
          description: Repair work order found and status returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Repair ticket found'
                  ticket:
                    type: object
                    properties:
                      ticketNumber:
                        type: string
                        example: 'WO-2026-0001'
                      status:
                        type: string
                        description: Current status of the work order
                        enum: ['pending', 'scheduled', 'in_progress', 'completed', 'cancelled']
                        example: 'pending'
                      priority:
                        type: string
                        description: 'Work-order priority (P0=urgent, P1=high, P2=medium, P3=low)'
                        enum: ['P0', 'P1', 'P2', 'P3']
                        example: 'P1'
                      productCategory:
                        type: string
                        example: '仓储机器人'
                      productsubCategory:
                        type: string
                        example: '导航传感器'
                      productModel:
                        type: string
                        example: 'WR-500 #7'
                      serialNumber:
                        type: string
                        example: 'SN20231015ABC124'
                      brand:
                        type: string
                        example: '中科机器人'
                      customerName:
                        type: string
                        example: '华创智联-张伟'
                      customerPhone:
                        type: string
                        example: '13800018888'
                      description:
                        type: string
                        example: '导航传感器异常，频繁偏航'
                      createdAt:
                        type: string
                        format: date-time
                        example: '2024-01-20T10:30:00Z'
                      updatedAt:
                        type: string
                        format: date-time
                        example: '2024-01-20T10:30:00Z'
        '400':
          description: Bad request - missing or malformed woNumber
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Repair work order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /repair/cancel:
    post:
      operationId: cancelRepair
      summary: Cancel a repair work order
      description: |
        Cancel an existing repair work order by its work-order number (WO-YYYY-NNNN).
        Identity verification is disabled — any caller may cancel any work order.
        404 means the work order does not exist. Cancellation is destructive;
        obtain explicit user confirmation first.
      tags:
        - Repair Service
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - woNumber
              properties:
                woNumber:
                  type: string
                  description: The work-order number (WO-YYYY-NNNN).
                  pattern: '^WO-\d{4}-\d{4}$'
                  example: 'WO-2026-0001'
      responses:
        '200':
          description: Work order cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Repair ticket cancelled'
                  ticketNumber:
                    type: string
                    example: 'WO-2026-0001'
                  status:
                    type: string
                    example: 'cancelled'
        '400':
          description: Bad request - missing or malformed woNumber
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Repair work order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Work order already cancelled or completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /repair/update:
    post:
      operationId: updateRepair
      summary: Update a repair work order
      description: |
        Update an existing repair work order's fault description, priority,
        and/or status by its work-order number. At least one of description /
        priority / status must be supplied; only the supplied fields change.
        Identity verification is disabled — any caller may update any work order.
        404 means the work order does not exist. To cancel a work order use
        /repair/cancel, not this endpoint.
      tags:
        - Repair Service
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - woNumber
              properties:
                woNumber:
                  type: string
                  description: The work-order number (WO-YYYY-NNNN).
                  pattern: '^WO-\d{4}-\d{4}$'
                  example: 'WO-2026-0001'
                description:
                  type: string
                  description: New fault description. Optional.
                  example: '导航传感器异常，已更换反光板仍偏航'
                priority:
                  type: string
                  description: 'New priority (P0=urgent, P1=high, P2=medium, P3=low). Optional.'
                  enum: ['P0', 'P1', 'P2', 'P3']
                  example: 'P1'
                status:
                  type: string
                  description: New status. Optional. To cancel a work order use /repair/cancel.
                  enum: ['pending', 'scheduled', 'in_progress', 'completed']
                  example: 'in_progress'
      responses:
        '200':
          description: Work order updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Repair ticket updated'
                  ticketNumber:
                    type: string
                    example: 'WO-2026-0001'
                  status:
                    type: string
                    example: 'in_progress'
                  priority:
                    type: string
                    example: 'P1'
                  description:
                    type: string
                    example: '导航传感器异常，已更换反光板仍偏航'
        '400':
          description: Bad request - missing/invalid fields or nothing to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Repair work order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Work order already cancelled or completed (cannot be modified)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /faq/simple:
    post:
      operationId: faqSimple
      summary: Search FAQ simple database
      description: |
        Search through a predefined FAQ database without using external knowledge base.
        This API provides quick answers to common questions using keyword-based matching.
        Does not require Bedrock Knowledge Base.
      tags:
        - FAQ & Knowledge Base
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: Natural language question or search query
                  example: '仓储机器人频繁偏航怎么办？'
      responses:
        '200':
          description: Search results from simple FAQ database
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                    description: The original search query
                    example: '仓储机器人频繁偏航怎么办？'
                  results:
                    type: array
                    description: List of relevant FAQ entries
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: FAQ entry ID
                          example: 'faq-001'
                        category:
                          type: string
                          description: FAQ category
                          example: '仓储机器人'
                        question:
                          type: string
                          description: The FAQ question
                          example: '仓储机器人频繁偏航/导航异常怎么办？'
                        answer:
                          type: string
                          description: The FAQ answer
                          example: '导航偏航常见原因与处理：1) 清洁导航传感器镜头与反光标识...'
                        score:
                          type: number
                          description: Relevance score (higher is more relevant)
                          example: 15
                  count:
                    type: integer
                    description: Number of results returned
                    example: 3
                  source:
                    type: string
                    description: Source of the results
                    example: 'simple_faq_database'
              example:
                query: '仓储机器人频繁偏航怎么办？'
                results:
                  - id: 'faq-001'
                    category: '仓储机器人'
                    question: '仓储机器人频繁偏航/导航异常怎么办？'
                    answer: '导航偏航常见原因与处理：1) 清洁导航传感器镜头与反光标识，避免灰尘遮挡。2) 检查地面二维码/反光板是否破损或被遮挡。3) 校准激光雷达与里程计，重新建图。4) 确认轮组无打滑、胎压正常。5) 若持续偏航，请创建维修工单。'
                    score: 15
                count: 1
                source: 'simple_faq_database'
        '400':
          description: Bad request - missing query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication

  schemas:
    RepairTicket:
      type: object
      properties:
        ticketNumber:
          type: string
          description: Unique work-order number (WO-YYYY-NNNN)
          example: 'WO-2026-0001'
        productCategory:
          type: string
          description: 'Top-level robot category: 仓储机器人 / 巡检机器人 / 协作机械臂 / 服务机器人'
          example: '仓储机器人'
        productsubCategory:
          type: string
          description: Faulty component
          example: '导航传感器'
        productModel:
          type: string
          description: Robot model
          example: 'WR-500 #7'
        serialNumber:
          type: string
          description: Unit serial number
          example: 'SN123456789'
        brand:
          type: string
          description: Product brand / manufacturer
          example: '中科机器人'
        description:
          type: string
          description: Description of the issue
          example: '导航传感器异常，频繁偏航'
        customerName:
          type: string
          description: Customer (company-contact) name
          example: '华创智联-张伟'
        customerPhone:
          type: string
          description: Customer phone number (also the ticket owner key)
          example: '13800018888'
        priority:
          type: string
          description: 'Work-order priority (P0=urgent, P1=high, P2=medium, P3=low)'
          enum: ['P0', 'P1', 'P2', 'P3']
          example: 'P1'
        status:
          type: string
          description: Current ticket status
          enum: ['pending', 'scheduled', 'in_progress', 'completed', 'cancelled']
          example: 'pending'
        createdAt:
          type: string
          format: date-time
          description: Ticket creation timestamp
          example: '2024-01-20T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: '2024-01-20T10:30:00Z'

security:
  - ApiKeyAuth: []

tags:
  - name: Hotel Search
    description: Operations for searching and discovering hotels
  - name: Booking Management
    description: Operations for creating, modifying, and cancelling reservations
  - name: Customer Service
    description: Operations for customer service and support
  - name: Repair Service
    description: Operations for requesting and tracking repair services
  - name: FAQ & Knowledge Base
    description: Operations for searching FAQ and knowledge base content
