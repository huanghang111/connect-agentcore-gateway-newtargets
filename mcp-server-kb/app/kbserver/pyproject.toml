[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kbserver"
version = "0.1.0"
description = "AgentCore MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp >= 1.19.0",
    "boto3",
    "strands-agents >= 1.41.0",
    "pydantic >= 2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
